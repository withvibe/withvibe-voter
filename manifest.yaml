id: withvibe.aquascape
name: Aquascape
description: Turn an env into a team-voted vibecoding game — prompts must be approved by the team before the agent applies them.
version: 0.1.0
icon: fish

# Built locally for now. Rebuild after changes:
#   docker build -t local/aquascape:0.1 .
# For the marketplace this becomes a public, multi-arch image:
#   ghcr.io/withvibe/aquascape:<version>
image: local/aquascape:0.1

# env scope: one container per env. Each env is its own scene / game board,
# with its own proposal queue + vote state. Postgres schema is isolated per
# (env, plugin) automatically.
scope: env

# Persistent state. The platform provisions a dedicated role + schema in the
# withvibe_plugins database and injects DATABASE_URL + PGSCHEMA.
storage:
  kind: shared-postgres

ui:
  path: /ui
  websocket: false

mcp:
  enabled: true
  path: /mcp
